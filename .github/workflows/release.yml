name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha

env:
  GIT_AUTHOR_NAME: "@dhis2-bot"
  GIT_AUTHOR_EMAIL: "apps@dhis2.org"
  GIT_COMMITTER_NAME: "@dhis2-bot"
  GIT_COMMITTER_EMAIL: "apps@dhis2.org"
  NPM_TOKEN: ${{secrets.DHIS2_BOT_NPM_TOKEN}}
  GH_TOKEN: ${{secrets.DHIS2_BOT_GITHUB_TOKEN}}
  CI: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{env.GH_TOKEN}}

      - uses: dhis2/action-commit-signing@v1
        with:
          ssh-signing-key: ${{ secrets.DHIS2_BOT_SSH_SIGNING_KEY }}
          ssh-signing-key-passphrase: ${{ secrets.DHIS2_BOT_SSH_SIGNING_PASSPHRASE }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify generated types exist
        run: |
          for f in src/v40.d.ts src/v41.d.ts src/v42.d.ts src/v43.d.ts; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f — run 'npm run update' and commit"
              exit 1
            fi
          done

      - run: npm run typecheck

      - name: Publish to NPM
        run: npx @dhis2/cli-utils release --publish npm
